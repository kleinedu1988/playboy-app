<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- Pojistka: spustí se jen skripty programu (i kdyby se do stránky dostal cizí kód z dat sbírky) -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'"/>
    <title>Pinup Katalog</title>
    <!-- Úvodní obrazovka (src/ui/uvod.js, fotka public/uvod-start.js): je vidět hned, ještě než se načtou skripty a styly
         programu; zmizí, až je první pohled sestavený. Styl je tady, protože style.css se načítá se skripty.
         Vzhled jako brána přihlášení (0.02.093, .ucet ve style.css): vlevo panel s vínovým přechodem, ikona a zlatý
         název, pod ním postup přípravy; vpravo fotka oblíbené modelky z minulého běhu s popiskem. Okno má stejnou
         velikost jako brána (nastaveni.go), takže přechod z brány do načítání nic nepřeskládá. -->
    <style>
        html, body { margin: 0; background: #0f0f12; }
        #uvod { position: fixed; inset: 0; z-index: 2147483000; display: grid; grid-template-columns: minmax(380px, 1fr) 1fr;
            background: #0f0f12; color: #f0f0f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: opacity .22s ease; --wails-draggable: drag; cursor: default; user-select: none; }
        #uvod.skryty { opacity: 0; pointer-events: none; }
        /* S kruhem jde přechod panelu přes celé okno (kruh leží na stejném pozadí, bez předělu) */
        #uvod.s-kruhem { background: linear-gradient(120deg, #5c1030 0%, #2c0817 26%, #120a0e 52%, #0f0f12 78%); }
        #uvod.s-kruhem .uvod-panel { background: none; }
        #uvod.bez-fotky { grid-template-columns: 1fr; }
        #uvod.bez-fotky .uvod-foto { display: none; }

        /* Panel: stejný přechod jako .ucet-panel */
        #uvod .uvod-panel { grid-column: 1; grid-row: 1; display: grid; place-items: center; padding: 48px 32px; overflow: hidden;
            background: linear-gradient(135deg, #5c1030 0%, #2c0817 38%, #120a0e 72%, #0f0f12 100%); }
        #uvod .uvod-obsah { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        #uvod .uvod-ikona { width: 64px; height: 64px; margin-bottom: 2px; border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
        /* Název zlatým pruhem jako logo (.ucet-znacka) */
        #uvod h1 { margin: 0; background: linear-gradient(90deg, #6e4f1a 0%, #c9a046 18%, #f6e3a1 34%, #fff7d6 42%, #d9b25a 55%, #9c7428 72%, #e8cc7c 88%, #7a5a20 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 34px; font-weight: 600;
            letter-spacing: .04em; line-height: 1.1; text-transform: uppercase; }
        /* Nadpis jako „Přihlášení“ (.ucet-nadpis), zlaté linky po stranách */
        #uvod .uvod-nadpis { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; margin: 10px 0 4px;
            color: #fff; font-size: 18px; font-weight: 300; letter-spacing: .08em; text-transform: uppercase; }
        #uvod .uvod-nadpis::before, #uvod .uvod-nadpis::after { content: ""; flex: 1; max-width: 48px; height: 1px; background: #c9a046; opacity: .7; }
        #uvod .uvod-verze { font-size: 11.5px; color: #b9a98a; letter-spacing: .14em; text-transform: uppercase; min-height: 14px; }
        /* Pruh postupu: zlatý jako tlačítko brány; posouvá ho transform (kompozitor), ne šířka */
        #uvod .uvod-pruh { width: 100%; height: 4px; margin-top: 14px; border-radius: 4px; background: rgba(255, 255, 255, .09); overflow: hidden; }
        #uvod .uvod-pruh i { display: block; width: 100%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #c9a046, #f6e3a1);
            transform: translateX(-94%); transition: transform .3s ease; }
        #uvod .uvod-krok { font-size: 13px; color: #e9e4dc; min-height: 17px; }
        #uvod .uvod-tlacitko { margin-top: 6px; padding: 7px 16px; border: 1px solid rgba(201, 160, 70, .55); border-radius: 6px; background: none;
            color: #e9e4dc; font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
        #uvod .uvod-tlacitko:hover, #uvod .uvod-tlacitko:focus-visible { border-color: #f6e3a1; color: #fff; outline: none; }
        /* Kroky přípravy (src/ui/uvod.js seznamUvodu, stavUvodu): jen řada teček; co se právě děje, říká jeden řádek
           (.uvod-krok) a pod ním podrobnost posledního kroku (.uvod-detail) – nic se nevypisuje pod sebe */
        #uvod .uvod-seznam { display: flex; gap: 7px; margin: 2px 0 0; padding: 0; list-style: none; }
        #uvod .uvod-seznam:empty { display: none; }
        #uvod .uvod-seznam li { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .14); transition: background-color .25s ease; }
        #uvod .uvod-seznam li.bezi { background: #f6e3a1; animation: uvod-tep 1s ease-in-out infinite; }
        #uvod .uvod-seznam li.hotovo { background: #b08a3a; }
        #uvod .uvod-seznam li.preskoceno { background: rgba(255, 255, 255, .3); }
        #uvod .uvod-seznam li.chyba { background: #e07a5a; }
        #uvod .uvod-detail { width: 100%; min-height: 15px; overflow: hidden; color: #a8949a; font-size: 11.5px; text-overflow: ellipsis;
            white-space: nowrap; font-variant-numeric: tabular-nums; }
        #uvod .uvod-cas { font-size: 11px; color: #8a767c; min-height: 14px; font-variant-numeric: tabular-nums; }
        @keyframes uvod-tep { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

        /* Kruh profilovek (návrh A, public/uvod-start.js) na místě fotky brány: vpravo na tmavém pozadí s vínovou září,
           zvětšený pro vyšší okno. Bez profilovek (první spuštění, zámek) zůstane jen panel přes celé okno. */
        #uvod .uvod-foto { grid-column: 2; grid-row: 1; position: relative; display: grid; place-items: center; overflow: hidden;
            background: radial-gradient(ellipse at 50% 50%, rgba(216, 27, 96, .10) 0%, transparent 60%); }
        #uvod .uvod-foto .uvod-kruh { scale: 1.45; }
        /* Scéna: perspektiva, měkká eliptická maska (okraje se ztrácejí do pozadí) */
        #uvod .uvod-kruh { position: relative; width: 460px; max-width: 100vw; height: 180px; margin: -4px 0 -6px;
            perspective: 550px; perspective-origin: 50% 50%;
            -webkit-mask-image: radial-gradient(ellipse 216px 115px at 50% 50%, #000 46%, rgba(0, 0, 0, .5) 72%, transparent 100%);
            mask-image: radial-gradient(ellipse 216px 115px at 50% 50%, #000 46%, rgba(0, 0, 0, .5) 72%, transparent 100%);
            animation: kruh-objevit .7s ease-out both; }
        /* růžová záře za přední fotkou */
        #uvod .uvod-kruh::before { content: ""; position: absolute; left: 50%; top: 50%; width: 260px; height: 173px; margin: -86px 0 0 -130px;
            background: radial-gradient(ellipse at center, rgba(216, 27, 96, .22) 0%, rgba(216, 27, 96, .07) 45%, transparent 70%); }
        /* závoj: boční fotky tmavnou podle polohy (= podle úhlu na válci), přední zůstane čistá */
        #uvod .uvod-kruh::after { content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(90deg, rgba(15, 15, 18, .85) 18%, rgba(15, 15, 18, .45) 33%, rgba(15, 15, 18, 0) 41%,
                rgba(15, 15, 18, 0) 59%, rgba(15, 15, 18, .45) 67%, rgba(15, 15, 18, .85) 82%); }

        /* Válec: posunutý o poloměr dozadu, aby přední fotka stála v rovině obrazovky (měřítko 1) */
        #uvod .kruh { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(-216px);
            will-change: transform; animation: kruh-otacet 31.2s cubic-bezier(.45, 0, .25, 1) -2.3s infinite; }

        #uvod .kruh-karta { position: absolute; left: 50%; top: 50%; width: 108px; height: 144px; margin: -72px 0 0 -54px;
            border-radius: 16px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
            transform: rotateY(calc(var(--i) * 30deg)) translateZ(216px);
            /* zástupce, dokud se fotka nenačte (nebo když se nenačte vůbec) */
            background: radial-gradient(ellipse 70% 55% at 50% 34%, #2a1c23 0%, #1b1a20 60%, #16161b 100%);
            box-shadow: 0 14px 30px rgba(0, 0, 0, .55); }
        #uvod .kruh-karta img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease;
            /* výřez z uloženého seznamu: --x/--y = coverX/coverY (%), --z = coverZoom (jako stylVyrezu) */
            object-position: var(--x, 50%) var(--y, 50%); transform-origin: var(--x, 50%) var(--y, 50%); transform: scale(var(--z, 1)); }
        #uvod .kruh-karta img.nacteno { opacity: 1; }
        /* jemná hrana a lesk */
        #uvod .kruh-karta::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .07) inset; background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 30%); }

        /* Úzké okno: fotka přes celé okno, panel průhlednou kartou (jako brána) */
        @media (max-width: 820px) {
            #uvod { grid-template-columns: 1fr; }
            #uvod .uvod-foto { grid-column: 1; }
            #uvod:not(.bez-fotky) .uvod-panel { grid-column: 1; background: none; padding: 24px 16px; }
            #uvod:not(.bez-fotky) .uvod-obsah { padding: 28px 24px; border-radius: 12px; background: rgba(70, 12, 34, .72);
                -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
            #uvod .uvod-foto .uvod-kruh { scale: 1.1; }
        }
        /* Nízké okno: zůstane jen pruh, tečky a krok */
        @media (max-height: 500px) { #uvod .uvod-detail, #uvod .uvod-cas, #uvod .uvod-ikona { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            #uvod, #uvod .uvod-pruh i { transition: none; }
            #uvod .uvod-seznam li.bezi { animation: none; }
        }
        /* Skrytý úvod (zámek, mizení) animaci zastaví */
        #uvod.skryty .kruh { animation-play-state: paused; }

        @keyframes kruh-objevit { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
        /* 12 kroků po 30°: v každém se válec rozjede a zpomalí (časování platí pro každý úsek), přední fotka chvíli postojí */
        @keyframes kruh-otacet {
            0% { transform: translateZ(-216px) rotateY(0deg); }
            8.3333% { transform: translateZ(-216px) rotateY(-30deg); }
            16.6667% { transform: translateZ(-216px) rotateY(-60deg); }
            25% { transform: translateZ(-216px) rotateY(-90deg); }
            33.3333% { transform: translateZ(-216px) rotateY(-120deg); }
            41.6667% { transform: translateZ(-216px) rotateY(-150deg); }
            50% { transform: translateZ(-216px) rotateY(-180deg); }
            58.3333% { transform: translateZ(-216px) rotateY(-210deg); }
            66.6667% { transform: translateZ(-216px) rotateY(-240deg); }
            75% { transform: translateZ(-216px) rotateY(-270deg); }
            83.3333% { transform: translateZ(-216px) rotateY(-300deg); }
            91.6667% { transform: translateZ(-216px) rotateY(-330deg); }
            100% { transform: translateZ(-216px) rotateY(-360deg); }
        }

        /* Omezený pohyb: statická řada pěti fotek, prostřední největší (pozice --p, |p| = --a nastaví uvod-start.js) */
        @media (prefers-reduced-motion: reduce) {
            #uvod .uvod-kruh { animation: none; }
            #uvod .uvod-kruh::after { display: none; }
            #uvod .kruh { animation: none; transform: none; transform-style: flat; will-change: auto; }
            #uvod .kruh-karta { z-index: calc(10 - var(--a)); opacity: calc(1 - var(--a) * .3);
                transform: translateX(calc(var(--p) * 112px)) scale(calc(1 - var(--a) * .17)); }
            #uvod .kruh-karta::after { content: ""; position: absolute; inset: 0; z-index: 2; background: #0f0f12; opacity: calc(var(--a) * .3); }
            #uvod .kruh-karta.mimo { display: none; }
            #uvod .kruh-karta img, #uvod .uvod-pruh i { transition: none; }
        }
    </style>
</head>
<body>
<div id="uvod" class="bez-fotky" role="status" aria-live="polite">
    <div class="uvod-foto" aria-hidden="true"></div>
    <section class="uvod-panel">
        <div class="uvod-obsah">
            <img class="uvod-ikona" src="./uvod.png" alt="" draggable="false"/>
            <h1>Pinup Katalog</h1>
            <div class="uvod-nadpis">Otevírám sbírku</div>
            <div class="uvod-verze"></div>
            <div class="uvod-pruh"><i></i></div>
            <div class="uvod-krok">Otevírám databázi…</div>
            <ol class="uvod-seznam" aria-label="Příprava programu"></ol>
            <div class="uvod-detail"></div>
            <div class="uvod-cas"></div>
        </div>
    </section>
</div>
<!-- Fotka oblíbené modelky z minulého běhu; obyčejný skript (CSP nepustí inline), běží před prvním vykreslením -->
<script src="./uvod-start.js"></script>
<div id="app"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
