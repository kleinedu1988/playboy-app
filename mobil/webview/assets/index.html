<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinup Katalog</title>
<!-- Aplikace pro telefon (0.02.085): stránka modelek z balíčku sbírky (program na PC ho nahrává na Disk se zálohou),
     jen ke čtení. Hero nahoře a dlaždice jako v programu; výřezy titulních a profilových fotek stejné. Most
     window.telefon (Hlavni.java → jádro v Go) dává přihlášení a balíček; události přicházejí do window.udalost. -->
<style>
  :root {
    --bg: #0f0b0d; --panel: #1a1417; --linka: #2e2428; --text: #f3eee8; --tlumeny: #a8979e;
    --akcent: #e0336f; --zlato: #f0c75e; --polomer: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .hidden { display: none !important; }

  /* Přihlášení */
  #brana { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 24px;
    background: radial-gradient(120% 80% at 50% 0%, #5c1030 0%, #2c0817 45%, var(--bg) 80%); }
  #brana img { width: 92px; height: 92px; border-radius: 22px; }
  #brana h1 { margin: 18px 0 6px; color: var(--zlato); font-weight: 300; letter-spacing: .14em; text-transform: uppercase; font-size: 26px; }
  #brana p { color: var(--tlumeny); margin: 6px 0; }
  .tlacitko { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 13px 26px;
    border-radius: 999px; background: var(--akcent); color: #fff; font-weight: 600; }
  .tlacitko:disabled { opacity: .6; }
  .chyba { color: #ff8fa8 !important; margin-top: 14px !important; }

  /* Lišta */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(15, 11, 13, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--linka); }
  header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--zlato); }
  header .pocet { color: var(--tlumeny); font-size: 13px; }
  .ikona { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--panel); }
  .ikona.toci svg { animation: toceni 1s linear infinite; }
  @keyframes toceni { to { transform: rotate(360deg); } }

  /* Hero */
  #hero { position: relative; margin: 14px 16px 6px; border-radius: var(--polomer); overflow: hidden; aspect-ratio: 4 / 5;
    background: var(--panel); }
  #hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #hero .prekryv { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
    background: linear-gradient(to top, rgba(10, 6, 8, .92) 0%, rgba(10, 6, 8, .35) 45%, transparent 70%); }
  #hero .nadtitulek { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--zlato); }
  #hero h2 { margin: 6px 0 4px; font-size: 30px; font-weight: 300; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1; }
  #hero .srdicka { color: var(--akcent); }
  #hero .popis { color: #d9cfd3; font-size: 13px; margin-top: 4px; }
  #hero .dalsi { position: absolute; top: 12px; right: 12px; padding: 7px 14px; border-radius: 999px;
    background: rgba(15, 11, 13, .6); backdrop-filter: blur(6px); font-size: 13px; }

  /* Řazení a hledání */
  .ovladani { padding: 10px 16px 4px; }
  #hledat { width: 100%; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--linka); background: var(--panel);
    color: var(--text); font: inherit; outline: none; }
  #hledat:focus { border-color: var(--akcent); }
  .razeni { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .razeni::-webkit-scrollbar { display: none; }
  .razeni button { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linka); color: var(--tlumeny); font-size: 13px; }
  .razeni button.vybrane { border-color: var(--akcent); color: var(--akcent); }

  /* Dlaždice */
  #mrizka { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px 16px 32px; }
  .dlazdice { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--panel);
    border: 1px solid var(--linka); content-visibility: auto; contain-intrinsic-size: 150px 200px; text-align: left; padding: 0; }
  .dlazdice img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dlazdice .jmeno { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 9px; font-weight: 600; font-size: 14px;
    background: linear-gradient(to top, rgba(10, 6, 8, .9), transparent); }
  .stitek { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 999px; font-size: 11px;
    background: rgba(15, 11, 13, .72); backdrop-filter: blur(4px); }
  .stitek.hodnoceno { color: #ff8fb0; }
  .prazdne { grid-column: 1 / -1; text-align: center; color: var(--tlumeny); padding: 40px 0; }

  /* Detail */
  #detail { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--bg); }
  #detail .fotka { position: relative; aspect-ratio: 3 / 4; background: var(--panel); overflow: hidden; }
  #detail .fotka img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #detail .zavrit { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; z-index: 2; width: 40px; height: 40px;
    border-radius: 50%; background: rgba(15, 11, 13, .7); font-size: 22px; }
  #detail .obsah { padding: 18px 20px 40px; }
  #detail h2 { margin: 0; font-size: 28px; font-weight: 300; letter-spacing: .05em; text-transform: uppercase; }
  #detail .srdicka { color: var(--akcent); margin-top: 4px; }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 18px 0 0; }
  #detail dt { color: var(--tlumeny); }
  #detail dd { margin: 0; }

  /* Účet */
  #ucet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; background: rgba(0, 0, 0, .55); }
  #ucet .list { background: var(--panel); border-radius: 18px 18px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
  #ucet p { margin: 4px 0; color: var(--tlumeny); }
  #ucet .radek { display: flex; gap: 10px; margin-top: 18px; }
  #ucet .radek button { flex: 1; padding: 12px; border-radius: 12px; background: var(--bg); }
  #ucet .radek .odhlasit { color: #ff8fa8; }

  #zprava { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; padding: 12px 16px;
    border-radius: 12px; background: #2a1d22; border: 1px solid var(--linka); font-size: 14px; }
</style>
</head>
<body>
<section id="brana" class="hidden">
  <div>
    <img src="ikona.png" alt="">
    <h1>Pinup Katalog</h1>
    <p>Tvoje sbírka v telefonu, jen ke čtení.</p>
    <p>Přihlas se stejným účtem Google jako v programu na PC.</p>
    <button class="tlacitko" id="prihlasit">Přihlásit se přes Google</button>
    <p class="chyba hidden" id="chybaBrany"></p>
  </div>
</section>

<main id="katalog" class="hidden">
  <header>
    <h1>Pinup Katalog</h1>
    <span class="pocet" id="pocet"></span>
    <button class="ikona" id="obnovit" title="Stáhnout novou verzi sbírky" aria-label="Obnovit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
    </button>
    <button class="ikona" id="ucetTlacitko" aria-label="Účet">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </header>
  <section id="hero" class="hidden"></section>
  <div class="ovladani">
    <input id="hledat" type="search" placeholder="Hledat modelku…" autocomplete="off">
    <div class="razeni" id="razeni"></div>
  </div>
  <div id="mrizka"></div>
</main>

<section id="detail" class="hidden"></section>
<section id="ucet" class="hidden"></section>
<div id="zprava" class="hidden"></div>

<script>
'use strict';
const most = window.telefon;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let balicek = null;
let razeni = 'oblibenost';
let hledani = '';
let heroModelka = null;
let stahuje = false;

// Řazení jako v programu (modelky bez údaje na konec)
const RAZENI = {
  oblibenost: { popisek: 'Oblíbené', klic: (m) => -(m.oblibenost || 0) },
  hodnoceni: { popisek: 'Srdíčka', klic: (m) => -(m.hodnoceni || 0) * 100 - (m.oblibenost || 0) },
  pridano: { popisek: 'Nově přidané', klic: (m) => m.pridano ? -Date.parse(m.pridano) || 0 : Infinity },
  rok: { popisek: 'Podle roku', klic: (m) => prvniRok(m) || Infinity },
  jmeno: { popisek: 'A–Z', klic: (m) => m.jmeno },
};

// Srdíčka po polovinách: 4.5 → 4½
function srdicka(h) {
  const cele = Math.floor(h);
  return `${cele || ''}${h - cele >= 0.5 ? '½' : ''}` || '0';
}

function prvniRok(m) {
  const roky = [...(m.vydani || []), ...(m.titulyJinde || []).map((t) => t.vydani || '')]
    .map((v) => parseInt(String(v).slice(0, 4), 10)).filter((r) => r > 1900);
  return roky.length ? Math.min(...roky) : 0;
}

function vek(m) {
  const d = Date.parse(m.narozeniDatum || '');
  if (!d) return '';
  return Math.floor((Date.now() - d) / (365.25 * 24 * 3600 * 1000));
}

// Adresa obrázku z Disku (šablona z programu na PC) v dané velikosti
function obrazek(id, velikost) {
  return balicek.sablonaObrazku.replace('{id}', id).replace('{velikost}', velikost);
}

// Výřez fotky jako v programu (stylVyrezu): posun a přiblížení
function vyrez(zoom = 1, x = 50, y = 50) {
  const pos = x !== 50 || y !== 50 ? `object-position:${x}% ${y}%;` : '';
  const z = zoom && zoom !== 1 ? `transform-origin:${x}% ${y}%;transform:scale(${zoom});` : '';
  return pos + z;
}

function titulni(m, velikost) {
  return m.coverId ? `<img loading="lazy" alt="" src="${esc(obrazek(m.coverId, velikost))}" style="${vyrez(m.coverZoom, m.coverX, m.coverY)}">` : '';
}

function profilova(m, velikost) {
  if (m.profilId) return `<img alt="" src="${esc(obrazek(m.profilId, velikost))}" style="${vyrez(m.profilZoom, m.profilX, m.profilY)}">`;
  return titulni(m, velikost);
}

function stitek(m) {
  if (m.hodnoceni > 0) return `<span class="stitek hodnoceno">♥ ${srdicka(m.hodnoceni)}</span>`;
  if (m.odhadHodnoceni > 0) return `<span class="stitek">odhad ${srdicka(m.odhadHodnoceni)}</span>`;
  return '';
}

function popisModelky(m) {
  const casti = [];
  const rok = prvniRok(m);
  if (m.playmateRoku) casti.push(`Playmate roku ${m.playmateRoku}`);
  else if (m.centerfoldy?.length) casti.push('Playmate');
  if (rok) casti.push(`poprvé ${rok}`);
  if (m.narodnost) casti.push(m.narodnost);
  return casti.join(' · ');
}

// Hero: náhodná z nejlepších (srdíčka, jinak oblíbenost) s fotkou
function vybratHero() {
  const s = balicek.modelky.filter((m) => m.profilId || m.coverId);
  if (!s.length) return null;
  const nej = Math.max(...s.map((m) => m.hodnoceni || 0));
  let kandidatky = nej > 0 ? s.filter((m) => (m.hodnoceni || 0) >= nej - 0.5) : [];
  if (kandidatky.length < 8) kandidatky = [...s].sort((a, b) => (b.oblibenost || 0) - (a.oblibenost || 0)).slice(0, 24);
  return kandidatky[Math.floor(Math.random() * kandidatky.length)];
}

function vykreslitHero() {
  const hero = $('hero');
  const m = heroModelka;
  if (!m) { hero.classList.add('hidden'); return; }
  hero.classList.remove('hidden');
  const h = m.hodnoceni > 0 ? `♥ ${srdicka(m.hodnoceni)}` : m.odhadHodnoceni > 0 ? `odhad ${srdicka(m.odhadHodnoceni)} ♥` : '';
  hero.innerHTML = `${profilova(m, 'w1200')}
    <button class="dalsi" data-dalsi>Další ↻</button>
    <div class="prekryv" data-id="${m.id}">
      <span class="nadtitulek">${m.hodnoceni > 0 ? 'Z tvých nejlepších' : 'Mohlo by se ti líbit'}</span>
      <h2>${esc(m.jmeno)}</h2>
      ${h ? `<span class="srdicka">${h}</span>` : ''}
      <span class="popis">${esc(popisModelky(m))}</span>
    </div>`;
}

function vykreslitRazeni() {
  $('razeni').innerHTML = Object.entries(RAZENI).map(([k, r]) =>
    `<button data-razeni="${k}" class="${k === razeni ? 'vybrane' : ''}">${r.popisek}</button>`).join('');
}

function vykreslitMrizku() {
  const q = hledani.trim().toLocaleLowerCase('cs').normalize('NFD').replace(/\p{M}/gu, '');
  let s = balicek.modelky;
  if (q) s = s.filter((m) => m.jmeno.toLocaleLowerCase('cs').normalize('NFD').replace(/\p{M}/gu, '').includes(q));
  const klic = RAZENI[razeni].klic;
  s = [...s].sort((a, b) => {
    const ka = klic(a), kb = klic(b);
    if (ka === kb) return a.jmeno.localeCompare(b.jmeno, 'cs');
    return typeof ka === 'string' ? ka.localeCompare(kb, 'cs') : ka - kb;
  });
  $('pocet').textContent = `${s.length} z ${balicek.modelky.length}`;
  $('mrizka').innerHTML = s.length ? s.map((m) => `<button class="dlazdice" data-id="${m.id}">
      ${titulni(m, 'w400')}${stitek(m)}<span class="jmeno">${esc(m.jmeno)}</span></button>`).join('')
    : '<p class="prazdne">Nic nenalezeno.</p>';
}

function otevritDetail(id) {
  const m = balicek.modelky.find((x) => x.id === id);
  if (!m) return;
  const radky = [];
  const rok = prvniRok(m);
  if (rok) radky.push(['Poprvé', rok]);
  if (m.vydani?.length) radky.push(['Vydání', m.vydani.join(', ')]);
  if (m.playmateRoku) radky.push(['Playmate roku', m.playmateRoku]);
  if (m.cyberGirl) radky.push(['Cyber Girl', m.cyberGirl]);
  for (const t of m.titulyJinde || []) radky.push([t.casopis || 'Jinde', [t.titul, t.vydani].filter(Boolean).join(' ')]);
  if (m.narozeniDatum) radky.push(['Narozena', `${m.narozeniDatum.split('-').reverse().join('. ')}${vek(m) ? ` (${vek(m)} let)` : ''}`]);
  if (m.narodnost) radky.push(['Národnost', m.narodnost]);
  if (m.pocetFotek) radky.push(['Fotek ve sbírce', m.pocetFotek]);
  if (m.role) radky.push(['Role', m.role]);
  const h = m.hodnoceni > 0 ? `♥ ${srdicka(m.hodnoceni)}` : m.odhadHodnoceni > 0 ? `odhad ${srdicka(m.odhadHodnoceni)} ♥` : '';
  const d = $('detail');
  d.innerHTML = `<div class="fotka"><button class="zavrit" data-zavrit aria-label="Zpět">‹</button>${profilova(m, 'w1200')}</div>
    <div class="obsah"><h2>${esc(m.jmeno)}</h2>${h ? `<div class="srdicka">${h}</div>` : ''}
    <dl>${radky.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;
  d.scrollTop = 0;
  d.classList.remove('hidden');
}

function zprava(text, ms = 5000) {
  const z = $('zprava');
  z.textContent = text;
  z.classList.remove('hidden');
  clearTimeout(zprava.casovac);
  zprava.casovac = setTimeout(() => z.classList.add('hidden'), ms);
}

function stav() {
  try { return JSON.parse(most?.stav() || '{}'); } catch { return {}; }
}

function nacistBalicek() {
  try {
    const text = most?.balicek() || '';
    balicek = text ? JSON.parse(text) : null;
  } catch {
    balicek = null;
  }
}

function zobrazit() {
  const s = stav();
  if (!balicek) {
    $('katalog').classList.add('hidden');
    $('brana').classList.remove('hidden');
    const chyba = $('chybaBrany');
    const text = !s.klient ? 'V aplikaci chybí přihlašovací údaje programu – je potřeba ji sestavit znovu.'
      : s.prihlasen ? (stahuje ? 'Stahuji sbírku z Disku…' : '') : s.chyba || '';
    chyba.textContent = text;
    chyba.classList.toggle('hidden', !text);
    chyba.classList.toggle('chyba', !stahuje);
    $('prihlasit').classList.toggle('hidden', !!s.prihlasen);
    $('prihlasit').disabled = !s.klient;
    return;
  }
  $('brana').classList.add('hidden');
  $('katalog').classList.remove('hidden');
  if (!heroModelka || !balicek.modelky.some((m) => m.id === heroModelka.id)) heroModelka = vybratHero();
  vykreslitHero();
  vykreslitRazeni();
  vykreslitMrizku();
}

function stahnout() {
  if (stahuje || !stav().prihlasen) return;
  stahuje = true;
  $('obnovit').classList.add('toci');
  if (!balicek) zobrazit();
  most.stahnout();
}

// Události z Javy
window.udalost = (nazev, text) => {
  if (nazev === 'prihlaseni') {
    $('prihlasit').disabled = false;
    if (text) zprava(text, 8000);
    zobrazit();
    if (!text) stahnout();
  } else if (nazev === 'balicek') {
    stahuje = false;
    $('obnovit').classList.remove('toci');
    if (text) {
      zprava(text, 8000);
    } else {
      const predtim = balicek?.vytvoren;
      nacistBalicek();
      if (predtim && predtim !== balicek?.vytvoren) zprava('Sbírka aktualizována.');
    }
    zobrazit();
  } else if (nazev === 'navrat' && !balicek) {
    zobrazit();
  }
};

// Zpět (tlačítko telefonu): zavře účet nebo detail; false = ukončit aplikaci
window.zpet = () => {
  for (const id of ['ucet', 'detail']) {
    if (!$(id).classList.contains('hidden')) { $(id).classList.add('hidden'); return true; }
  }
  return false;
};

$('prihlasit').addEventListener('click', () => {
  $('prihlasit').disabled = true;
  most?.prihlasit();
});
$('obnovit').addEventListener('click', stahnout);
$('hledat').addEventListener('input', (e) => { hledani = e.target.value; vykreslitMrizku(); });
$('razeni').addEventListener('click', (e) => {
  const b = e.target.closest('[data-razeni]');
  if (!b) return;
  razeni = b.dataset.razeni;
  try { localStorage.setItem('razeni', razeni); } catch {}
  vykreslitRazeni();
  vykreslitMrizku();
});
$('mrizka').addEventListener('click', (e) => {
  const d = e.target.closest('[data-id]');
  if (d) otevritDetail(Number(d.dataset.id));
});
$('hero').addEventListener('click', (e) => {
  if (e.target.closest('[data-dalsi]')) { heroModelka = vybratHero(); vykreslitHero(); return; }
  otevritDetail(heroModelka.id);
});
$('detail').addEventListener('click', (e) => {
  if (e.target.closest('[data-zavrit]')) $('detail').classList.add('hidden');
});
$('ucetTlacitko').addEventListener('click', () => {
  const s = stav();
  const vytvoren = balicek?.vytvoren ? new Date(balicek.vytvoren).toLocaleString('cs-CZ') : '';
  $('ucet').innerHTML = `<div class="list">
      <p>${s.prihlasen ? `Přihlášen jako <strong>${esc(s.email || 'účet Google')}</strong>` : 'Nejsi přihlášený'}</p>
      ${vytvoren ? `<p>Sbírka z ${esc(vytvoren)} · ${balicek.modelky.length} modelek</p>` : ''}
      <p>Verze aplikace ${esc(most?.verze() || '')}</p>
      <div class="radek"><button data-zavrit>Zavřít</button>${s.prihlasen ? '<button class="odhlasit" data-odhlasit>Odhlásit</button>' : ''}</div>
    </div>`;
  $('ucet').classList.remove('hidden');
});
$('ucet').addEventListener('click', (e) => {
  if (e.target.closest('[data-odhlasit]')) {
    most?.odhlasit();
    balicek = null;
    heroModelka = null;
    $('ucet').classList.add('hidden');
    zobrazit();
  } else if (e.target.closest('[data-zavrit]') || e.target === $('ucet')) {
    $('ucet').classList.add('hidden');
  }
});

try { razeni = RAZENI[localStorage.getItem('razeni')] ? localStorage.getItem('razeni') : razeni; } catch {}
